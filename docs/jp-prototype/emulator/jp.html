<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaten test page</title>
<style>
  html, body { margin:0; background:#000; color:#fff;
               font-family: "Noto Sans CJK JP", "Noto Sans JP", sans-serif; }
  h1 { font-size:22px; color:#8ab4f8; margin:14px 16px 6px; }
  p.note { font-size:14px; color:#9aa0a6; margin:0 16px 18px; }
  .line { font-size:44px; line-height:1.7; margin:0 16px 22px; letter-spacing:0.02em; }
  .kana { color:#fff; }
  .katakana { color:#ffd54f; }
  .boxed { border:2px solid #7c4dff; border-radius:12px; padding:10px 14px; margin:0 16px 26px; }
</style>
</head>
<body>
  <h1>Gaten OCR / lookup test</h1>
  <p class="note">Circle a line with the lasso, then check the words Gaten finds.</p>

  <div class="line" id="l1">猫が水を飲む</div>
  <div class="line" id="l2">日本語の勉強は楽しいです</div>
  <div class="line katakana" id="l3">コンピュータを使っています</div>
  <div class="line" id="l4">学校へ行きます</div>
  <div class="line" id="l5">友達と映画を見ました</div>
  <div class="line" id="l6">ありがとうございました</div>

  <div class="boxed">
    <div class="line" id="l7" style="font-size:38px;margin:0">明日は図書館で勉強します</div>
  </div>
</body>
</html>
