<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Gaten app icon: black square with a white G" color="#FFFFFF">
  <title>Gaten app icon</title>
  <!-- Gaten's original mark: the letter G drawn as one squared stroke on a black
       rounded square. The rect is the ground and the glyph takes the
       surrounding ink, so the same art inverts for the dark theme (white
       ground, black G).

       This is no longer the launcher icon: that now comes from the approved
       package in src/rn/assets/branding (gaten-icon-light.svg and
       gaten-icon-dark.svg), drawn onto the 108dp adaptive canvas by
       app/src/main/res/drawable/ic_launcher_foreground.xml. This squared stroke
       survives as the tile-sized mark the Quick Settings tile, the capture
       notification and the floating bubble share —
       app/src/main/res/drawable/ic_qs_lookup.xml. -->
  <rect width="128" height="128" rx="28" fill="#000000"/>
  <path d="M94 34H59C39 34 29 46 29 65C29 86 41 97 61 97H96V71H73" fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="square" stroke-linejoin="miter" />
</svg>
