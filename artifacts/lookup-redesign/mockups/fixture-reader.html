<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader fixture</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; background: #FDFDFD; color: #17171A;
               font-family: "Noto Sans JP", "Noto Sans CJK JP", system-ui, sans-serif; }
  .page { padding: 28px 22px 64px; font-size: 34px; line-height: 1.7; }
  .panel { border: 3px solid #17171A; border-radius: 4px; padding: 18px 20px; margin: 0 0 26px; }
  .balloon { border: 3px solid #17171A; border-radius: 999px; padding: 14px 26px; margin: 0 0 26px; }
  .small { font-size: 26px; }
  .dark { background: #101114; color: #F5F5F6; padding: 22px 20px; margin: 0 0 26px; }
  .dark .balloon, .dark .panel { border-color: #F5F5F6; }
  @media (prefers-color-scheme: dark) {
    html, body { background: #101114; color: #F5F5F6; }
    .panel, .balloon { border-color: #F5F5F6; }
    .dark { background: #1B1C21; }
  }
</style></head>
<body>
<div class="page">
  <div class="panel">
    <div>猫が窓のそばで</div>
    <div>眠っている。</div>
  </div>
  <div class="balloon">今日は少し寒いね。</div>
  <div class="panel small">
    <div>彼女は静かに本を閉じた。</div>
    <div>窓の外はもう夕暮れだった。</div>
  </div>
  <div class="dark">
    <div>だれかが呼んでいる。</div>
    <div class="small">その声は遠く聞こえていた。</div>
  </div>
</div>
</body></html>
