[versions]
agp = "8.11.0"
# KGP 2.2.20-2.2.21 is the oldest line whose fully supported range covers this project's
# Gradle 8.13 / AGP 8.11.0 (Kotlin docs: KGP 2.1.x tops out at Gradle 8.12.1 / AGP 8.7.2).
# Navigation3 1.1.7 is also compiled against Kotlin 2.1.20 (metadata 2.1.0).
kotlin = "2.2.21"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.12.0"

# Oldest BOM whose Compose UI/animation/foundation (1.10.0) satisfies navigation3-ui 1.1.7's
# requirement of Compose 1.10.0; it also pins material3 1.4.0 (stable) and material-icons-extended
# 1.7.8, so material3 no longer needs a version of its own.
composeBom = "2025.12.01"
# Newest Navigation3 stable that this toolchain can consume: 1.2.0's AAR metadata demands
# compileSdk 37 and AGP 9.1.0 (1.1.7 needs compileSdk 36 / AGP 8.9.1).
navigation3 = "1.1.7"
lifecycleViewmodelNavigation3 = "2.10.0"
kotlinxSerialization = "1.9.0"
# Romaji to kana for the search box (tokyo -> ときょ). Pure Kotlin/JVM, MIT, no Android or
# transitive dependencies; the only released line.
wanakana = "1.1.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNavigation3" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
wanakana-core = { group = "dev.esnault.wanakana", name = "wanakana-core", version.ref = "wanakana" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
