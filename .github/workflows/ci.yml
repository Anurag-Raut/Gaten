name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # React Native's Gradle plugin is built from node_modules (settings.gradle.kts includes it),
      # and autolinking runs the bundled CLI, so the JS dependencies come first: without them Gradle
      # cannot even configure. The engines field asks for 20.19.4+ / 22.13+ / 24.3+.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install the JS dependencies
        run: npm ci

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache the generated JMdict database
        id: jmdict-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/db/jmdict.sqlite
          key: jmdict-${{ hashFiles('tools/build_jmdict_db.py') }}

      - name: Build the JMdict database
        if: steps.jmdict-cache.outputs.cache-hit != 'true'
        run: python3 tools/build_jmdict_db.py

      # Both databases are gitignored build inputs, and the debug build verifies both.
      - name: Cache the generated example-sentence database
        id: examples-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/db/examples.sqlite
          key: examples-${{ hashFiles('tools/build_examples_db.py') }}

      - name: Build the example-sentence database
        if: steps.examples-cache.outputs.cache-hit != 'true'
        run: python3 tools/build_examples_db.py

      # The RTK reference asset is generated the same way and verified by the debug build.
      - name: Cache the generated RTK database
        id: rtk-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/db/rtk.sqlite
          key: rtk-${{ hashFiles('tools/build_rtk_db.py') }}

      - name: Build the RTK database
        if: steps.rtk-cache.outputs.cache-hit != 'true'
        run: python3 tools/build_rtk_db.py

      # The manga-ocr weights are gitignored and fetched by the build, so a run without the cache
      # downloads ~117 MB. The key is bumped by hand when the catalog's URLs or files change.
      - name: Cache the bundled manga-ocr model
        id: manga-ocr-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/manga-ocr
          key: manga-ocr-int8-v1
          restore-keys: manga-ocr-int8-

      - name: Assemble debug and run unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest

      - name: Upload the arm64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gaten-arm64-v8a-debug
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
