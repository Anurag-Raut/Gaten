name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache the generated JMdict database
        id: jmdict-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/db/jmdict.sqlite
          key: jmdict-${{ hashFiles('tools/build_jmdict_db.py') }}

      - name: Build the JMdict database
        if: steps.jmdict-cache.outputs.cache-hit != 'true'
        run: python3 tools/build_jmdict_db.py

      - name: Assemble debug and run unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest

      - name: Upload the arm64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gaten-arm64-v8a-debug
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
