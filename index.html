<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaten</title>
<meta name="description" content="Gaten — an offline Japanese dictionary and study app for Android.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #6D28D9;
    --bg2: #4C1D95;
    --ink: #FFFFFF;
    --soft: #EDE9FE;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background: linear-gradient(135deg, var(--bg), var(--bg2));
    color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 30rem; text-align: center; }
  h1 { font-size: 2.75rem; margin: 0 0 .5rem; letter-spacing: -0.02em; }
  p { margin: 0 0 1.5rem; color: var(--soft); }
  a.button {
    display: inline-block;
    padding: .7rem 1.4rem;
    border-radius: 999px;
    background: #FFFFFF;
    color: #4C1D95;
    font-weight: 600;
    text-decoration: none;
  }
  a.button:hover { background: var(--soft); }
</style>
</head>
<body>
<main>
  <h1>Gaten</h1>
  <p>An offline Japanese dictionary and study companion for Android.</p>
  <a class="button" href="./privacy/">Privacy policy</a>
</main>
</body>
</html>
